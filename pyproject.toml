[project]
name = "twl"
version = "0.0.1"
description = "Resource-budgeted think-while-listening for on-device cascaded voice agents"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/twl"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=twl --cov-report=term-missing"

# Pipecat 0.0.108 ships no py.typed marker; its API is consumed at the module
# boundary only. Errors inside our own code remain fully strict.
[[tool.mypy.overrides]]
module = ["pipecat.*"]
ignore_missing_imports = true
follow_untyped_imports = true
