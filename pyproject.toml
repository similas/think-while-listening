[project]
name = "twl"
version = "0.0.1"
description = "Resource-budgeted think-while-listening for on-device cascaded voice agents"
requires-python = ">=3.10"
# Only what the repository imports beyond the measurement stack, which README.md
# pins. Installed into ~/.venvs/twl and ~/.venvs/twl-learn with --no-deps
# (2026-11-22): whisper-normalizer's other dependencies serve Indic languages.
dependencies = [
    "whisper-normalizer==0.1.15",  # the number-normalized WER scorer
    "more-itertools==11.1.0",  # imported by whisper-normalizer
    "regex==2026.9.10",  # imported by whisper-normalizer
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The pre-roll audit's populations replicate scorer filters verbatim, with
# their line lengths and their unused unpackings (2026-11-22).
"src/scripts/preroll_pop/*" = ["E501", "RUF059"]

[tool.mypy]
strict = true
files = ["src/twl"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=twl --cov-report=term-missing"

# Pipecat 0.0.108 ships no py.typed marker; its API is consumed at the module
# boundary only. Errors inside our own code remain fully strict.
[[tool.mypy.overrides]]
module = ["pipecat.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# whisper-normalizer ships no type information; it is called at one boundary
# (twl.wer.normalize_num) whose result is coerced to str.
[[tool.mypy.overrides]]
module = ["whisper_normalizer.*"]
ignore_missing_imports = true
follow_untyped_imports = false
