# REACTIVE on Spoken-MQA multi_step_reasoning (seed 20260922).
#
# ONE CHANGE from reactive.yaml: partials at a FIXED CADENCE covering the whole
# utterance, instead of three fixed offsets. The probe varies the FRACTION of
# the utterance heard; the pipeline's canonical [1.0, 2.0, 3.0] samples only the
# first 3 s, which on a 15.4 s median utterance is the first 0.19 of it. To put
# window(f) on the same f axis as p_usable(f), partials have to reach the end.
#
# CADENCE 2.5 s, SET BY THE IN-PIPELINE DECODE — NOT THE OFFLINE ONE. The first
# attempt used 1.0 s, derived from tiny's OFFLINE fit (847 ms fixed, median 759
# ms, measured over saved prefixes with nothing else running). In the pipeline
# tiny decodes in a median of 1294 ms, p95 1958, max 3081 (n=274, run
# reactive-20260922-114950-c676ba): 1.7x the offline number, because it shares
# cores 3-5 with VAD, the agent, TTS and the final base decode. At a 1.0 s
# cadence the decodes never kept up (achieved cadence 1346 ms), the backlog
# never drained, and from turn 16 the VAD was starved badly enough to fragment
# utterances — 72 of 94 turns had no endpoint at all and the run was unusable
# for window(f).
#
# 2.5 s clears the p95 with ~0.5 s of slack per partial, so a backlog drains
# instead of accumulating. On the 15.4 s median utterance it still yields ~6
# partials spanning f = 0.16 to 0.97, which covers every fraction the prefix
# probe reports.
#
# The cost of the extra partials is the covariate: STT commit latency against
# the canonical offsets on the same items, reported paired.
audio:
  sample_rate: 16000
  channels: 1
  input_device_substr: "reSpeaker"
  # The array delivers 2 DSP-processed channels; pick one EXPLICITLY. Measured
  # 2026-09-15 (results/raw/capture_channels/): mean WER ch1 0.025, ch0 0.050,
  # downmix 0.250. Channel 1 is also ~3x the level of channel 0.
  device_channels: 2
  capture_channel: 1
  # Playback goes to the PortAudio 'pulse' device; PULSE_SINK picks the node.
  # Headless default twl_null (created by run scripts); set pulse_sink to
  # "alsa_output.usb-Jieli..." to hear replies on the room speaker.
  output_device_substr: "pulse"
  pulse_sink: "twl_null"

vad:
  confidence: 0.7
  start_secs: 0.2
  stop_secs: 0.8
  min_volume: 0.6

stt:
  model: "base"
  compute_type: "int8"
  language: "en"
  cpu_threads: 3
  cpu_affinity: [3, 4, 5]
  # Two-engine STT, decided 2026-09-17 on the live comparison: tiny for
  # partials, base for the final, SHARED cores 3-5 and no pinning between them.
  # Splitting the cores cost +1089 ms of commit latency (results/NOTES.md).
  partial_offsets_s: [2.5, 5.0, 7.5, 10.0, 12.5, 15.0, 17.5, 20.0, 22.5, 25.0, 27.5, 30.0, 32.5, 35.0]
  partial_model: "tiny"
  partial_cpu_threads: 3

llm:
  host: "127.0.0.1"
  port: 8093
  model_path: "/home/ali/voice-companion/models/gemma-4-E2B-q4_0.gguf"
  ctx_size: 2048
  threads: 3
  cpu_affinity: [0, 1, 2]
  n_gpu_layers: 99
  parallel: 1
  cache_reuse: 0
  memory_max_mb: 3500
  system_prompt: "You are a concise voice assistant. Answer in one or two short sentences."
  max_tokens: 150
  temperature: 0.5
  # HTTP client timeout for the answer request. 30 s, not httpx's 120 s
  # default: max_tokens 150 at the measured 31.8 ms/token (n=7062 generations,
  # NOTES 2026-09-22) is ~4.8 s, plus prefill. 30 s is ~6x the worst expected
  # reply and still bounds the progress watchdog, which otherwise treats
  # "generating" as a sign of life for as long as the client will wait.
  request_timeout_s: 30.0

tts:
  voice_path: "/home/ali/voice-companion/models/en_US-lessac-medium.onnx"
  cpu_threads: 2

telemetry:
  interval_ms: 100

results_dir: "results/raw"
